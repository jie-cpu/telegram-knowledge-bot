version: "3.9"

services:
  bot:
    build: .
    env_file: .env
    volumes:
      - knowledge_data:/app/data
    restart: unless-stopped
    # Scale horizontally: docker compose up --scale bot=3
    # Note: in-process queue means each worker has its own queue.
    # Switch to Redis-backed queue before scaling.

volumes:
  knowledge_data:
