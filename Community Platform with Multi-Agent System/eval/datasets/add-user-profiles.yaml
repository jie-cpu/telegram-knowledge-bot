# =============================================================================
# Golden Evaluation Scenario: Add User Profile Pages
# =============================================================================
# This scenario tests the full multi-agent lifecycle: from a vague product
# goal to deployed, tested, and monitored code.
# =============================================================================

# ── Scenario Metadata ──────────────────────────────────────────────────────

id: "add-user-profiles"
name: "Add User Profile Pages with Avatar Upload"
difficulty: "medium"  # easy | medium | hard
estimated_duration_minutes: 45
tags:
  - "feature"
  - "backend"
  - "frontend"
  - "storage"

# ── Input ──────────────────────────────────────────────────────────────────

goal: "Add a user profile page where users can view and edit their profile
information and upload an avatar photo."

# Context the orchestrator receives about the existing platform
context:
  platform_description: |
    A community web platform with user authentication (JWT-based), a
    PostgreSQL database, FastAPI backend, and React frontend. Users can
    register, log in, and view a feed of posts.

  existing_endpoints:
    - POST /api/v1/auth/register
    - POST /api/v1/auth/login
    - GET  /api/v1/auth/me

  existing_database_tables:
    - users (id, email, username, password_hash, created_at)

  existing_frontend_routes:
    - /login
    - /register
    - /feed

# ── Acceptance Criteria ───────────────────────────────────────────────────

acceptance_criteria:
  - id: "AC-1"
    description: "User can view their own profile at /profile"
    check: "GET /api/v1/profiles/me returns 200 with user profile data"

  - id: "AC-2"
    description: "User can edit their display name and bio"
    check: "PUT /api/v1/profiles/me with {display_name, bio} returns updated profile"

  - id: "AC-3"
    description: "User can upload an avatar image"
    check: "POST /api/v1/avatars with multipart image returns avatar URL"

  - id: "AC-4"
    description: "Avatar upload validates file type (only PNG, JPG, WebP)"
    check: "Uploading a .gif returns 422 with validation error"

  - id: "AC-5"
    description: "Avatar upload validates file size (max 5 MB)"
    check: "Uploading a 10 MB file returns 413"

  - id: "AC-6"
    description: "Frontend profile page displays avatar, display name, and bio"
    check: "React component renders all fields and handles empty state"

  - id: "AC-7"
    description: "Profile API is properly tested with >75% coverage"
    check: "pytest coverage report shows >=75% for profiles module"

# ── Expected Agent Behavior ───────────────────────────────────────────────

expected_agent_behavior:
  decomposition:
    - task: "Database schema for profiles and avatar storage"
      assigned_to: "se_agent"
      depends_on: []

    - task: "API endpoints (GET/PUT profile, POST avatar)"
      assigned_to: "se_agent"
      depends_on: ["database schema"]

    - task: "Avatar validation and storage logic"
      assigned_to: "se_agent"
      depends_on: ["API endpoints"]

    - task: "Test suite for profile API"
      assigned_to: "tester_agent"
      depends_on: ["API endpoints"]

    - task: "Frontend profile page component"
      assigned_to: "se_agent"
      depends_on: ["API endpoints"]

    - task: "Frontend tests for profile page"
      assigned_to: "tester_agent"
      depends_on: ["frontend profile page"]

    - task: "End-to-end tests"
      assigned_to: "tester_agent"
      depends_on: ["frontend tests", "API tests"]

  max_expected_revision_loops: 3  # SE ↔ Tester handoffs before acceptance

  # Anti-patterns the evaluation checks for (the system should NOT do these)
  anti_patterns:
    - "Writing tests before code exists"                     # Tester must wait for SE output
    - "Modifying test files as the SE agent"                 # Role violation
    - "Skipping validation for avatar upload"                # Security hole
    - "Hardcoding secrets or API keys in source code"        # Security violation
    - "Deploying without passing tests"                      # CI gate violation

# ── Evaluation Criteria ───────────────────────────────────────────────────

evaluation:
  # Each criterion is weighted; final score is a weighted average
  criteria:
    - id: "E1"
      description: "All acceptance criteria (AC-1 through AC-7) are met"
      weight: 0.35
      check: "manual_review"

    - id: "E2"
      description: "Test coverage >=75% for new code"
      weight: 0.15
      check: "coverage_report"

    - id: "E3"
      description: "LLM-judge score >=6.0/10 for code quality"
      weight: 0.15
      check: "llm_judge"

    - id: "E4"
      description: "No anti-patterns detected in the execution trace"
      weight: 0.15
      check: "trace_analysis"

    - id: "E5"
      description: "Task graph matches expected decomposition (within tolerance)"
      weight: 0.10
      check: "graph_similarity"

    - id: "E6"
      description: "Total cost under $0.50 for this feature"
      weight: 0.10
      check: "cost_analysis"

  passing_threshold: 0.75  # must score 75%+ to pass

# ── Notes for the Hiring Manager ──────────────────────────────────────────

notes: |
  This is a representative feature-addition scenario. It tests all four
  agents: the Product Agent refines the goal, the SE Agent writes code,
  the Tester Agent validates it, and the On-Call Agent deploys and monitors.

  To stress-test the system, try modifying config.yaml before running:
  - Set `min_coverage: 0.9` — the system must generate more thorough tests.
  - Set `se_agent.model: gpt-4o-mini` — observe how a weaker model affects
    code quality and revision loop count.
  - Set `auto_rollback: false` — the On-Call Agent will pause for human
    approval before rolling back.

  Reference output: eval/expected_outputs/add-user-profiles/
