# =============================================================================
# Community Platform — Multi-Agent System Configuration
# =============================================================================
# This is the single point of control for the entire agent system.
# Hiring managers can tweak any parameter and re-run scenarios without
# touching a line of code. See config.schema.json for validation rules.
# =============================================================================

# ---------------------------------------------------------------------------
# Orchestrator
# ---------------------------------------------------------------------------
orchestrator:
  # The LLM model used for orchestration logic (decomposition, scheduling,
  # conflict resolution). Needs strong reasoning — use a capable model.
  model: "gpt-4o"

  # Maximum number of orchestration iterations before a goal is force-resolved.
  # Prevents runaway sessions. Increase for very complex goals.
  max_iterations: 50

  # Hard timeout per goal. If the orchestrator exceeds this, it checkpoints
  # and suspends. The goal can be resumed later.
  timeout_minutes: 120

  # How deep to decompose goals into subtasks. Depth 3 means:
  # Goal → Epics → Tasks → Sub-tasks. Higher = more granular.
  task_decomposition_depth: 3

  # How many revision loops between two agents (e.g., SE ↔ Tester) before
  # the orchestrator escalates to a human or fallback.
  escalation_threshold: 5

  # How often the orchestrator writes a checkpoint to the state database.
  # Lower values = more recovery granularity but more write overhead.
  checkpoint_interval_seconds: 300

  # How often agents must report "I'm alive" to the orchestrator.
  heartbeat_interval_seconds: 60

  # Maximum consecutive heartbeat misses before an agent is declared dead.
  max_missed_heartbeats: 3

# ---------------------------------------------------------------------------
# Software Engineering Agent
# ---------------------------------------------------------------------------
agents:
  se_agent:
    # Model for code generation. Should be strong at coding tasks.
    model: "gpt-4o"

    # Temperature for code generation. Lower = more deterministic.
    # Higher = more creative (useful for exploring alternative implementations).
    temperature: 0.2

    # After this many consecutive compile/lint failures, the agent pauses
    # and the orchestrator requests spec clarification from the PM Agent.
    max_consecutive_failures: 3

    # Tools the SE Agent is allowed to use.
    allowed_tools:
      - "read"        # read files from the workspace
      - "write"       # write new files
      - "edit"        # edit existing files
      - "lint"        # run ruff linter
      - "git"         # commit and push changes
      - "typecheck"   # run mypy type checker

    # Sandbox settings: when enabled, the agent writes to an isolated
    # workspace that is merged back only after tests pass.
    sandbox_enabled: true

    # Output language(s) for code generation.
    languages:
      - "python"       # backend (FastAPI)
      - "typescript"   # frontend (React)

# ---------------------------------------------------------------------------
# Testing Agent
# ---------------------------------------------------------------------------
  tester_agent:
    # Testing uses a cheaper model since it runs evaluation, not generation.
    # Cost savings: ~70 % vs. using the full model for every eval call.
    model: "gpt-4o-mini"

    # Minimum acceptable test coverage (0.0 – 1.0). If below this, the
    # Tester marks the task as "needs revision."
    min_coverage: 0.75

    # LLM-as-judge scoring threshold (0.0 – 10.0). Scores below this
    # trigger a revision request. The judge evaluates:
    #   - Code style consistency
    #   - Security pattern usage (input sanitization, auth checks)
    #   - Error handling coverage
    #   - Test completeness (edge case coverage)
    llm_judge_threshold: 6.0

    # Whether to generate property-based tests (via Hypothesis) in addition
    # to example-based tests. Catches edge cases the developer didn't think of.
    property_based_tests: true

    # Max number of test generation + run cycles before giving up.
    max_test_iterations: 3

# ---------------------------------------------------------------------------
# On-Call Monitoring Agent
# ---------------------------------------------------------------------------
  oncall_agent:
    model: "gpt-4o-mini"

    # How often the agent polls monitoring endpoints (seconds).
    poll_interval_seconds: 60

    # Thresholds that trigger alerts
    p99_latency_threshold_ms: 500
    error_rate_threshold: 0.01       # 1 %
    memory_leak_threshold_mb: 200    # increase per hour

    # Whether to allow automated rollback without human approval.
    auto_rollback: true

    # Grace period (seconds) before an alert becomes a page. Prevents
    # flapping — the system must be degraded for this long before acting.
    alert_grace_period_seconds: 120

    # Monitoring endpoints
    endpoints:
      health: "http://localhost:8000/health"
      metrics: "http://localhost:9090/metrics"
      grafana: "http://localhost:3000"

# ---------------------------------------------------------------------------
# Product Management Agent
# ---------------------------------------------------------------------------
  pm_agent:
    model: "gpt-4o"

    # Whether to enforce acceptance criteria before marking a goal complete.
    require_acceptance_criteria: true

    # How thoroughly to explore edge cases during spec writing.
    # Options: "minimal", "standard", "comprehensive"
    edge_case_depth: "comprehensive"

    # Template file for PRD generation
    spec_template: "agents/pm_agent/templates/prd.md"

# ---------------------------------------------------------------------------
# State & Persistence
# ---------------------------------------------------------------------------
state:
  # Backend database for shared state.
  # Options: "sqlite" (local) or "postgresql" (production)
  backend: "sqlite"

  # SQLite path (only used if backend is "sqlite")
  sqlite_path: "data/state.db"

  # PostgreSQL connection string (only used if backend is "postgresql")
  postgres_dsn: "postgresql://user:password@localhost:5432/community_platform"

  # How often to auto-checkpoint (seconds). Also triggered on agent handoff.
  checkpoint_interval_seconds: 300

  # Maximum number of checkpoints to retain (rolling window).
  max_checkpoints: 50

# ---------------------------------------------------------------------------
# LLM Providers
# ---------------------------------------------------------------------------
llm:
  # Default provider. Configure at least one provider below.
  default_provider: "deepseek"

  providers:
    openai:
      api_key: "${OPENAI_API_KEY}"        # set via environment variable
      organization: "${OPENAI_ORG_ID}"    # optional
      default_model: "gpt-4o"
      fallback_model: "gpt-4o-mini"
      temperature: 0.2
      max_tokens: 4096
      max_retries: 3
      timeout_seconds: 60

    anthropic:
      api_key: "${ANTHROPIC_API_KEY}"
      default_model: "claude-sonnet-4-20250514"
      max_retries: 3
      timeout_seconds: 60

    # DeepSeek (OpenAI-compatible API)
    deepseek:
      api_key: "${DEEPSEEK_API_KEY}"
      default_model: "deepseek-chat"
      temperature: 0.2
      max_tokens: 4096
      max_retries: 3
      timeout_seconds: 60

    # Gemini via OpenAI-compatible endpoint
    gemini:
      api_key: "${GEMINI_API_KEY}"
      default_model: "gemini-2.5-flash"
      temperature: 0.2
      max_tokens: 4096
      max_retries: 3
      timeout_seconds: 60

    # Local models via Ollama (no API key needed)
    ollama:
      base_url: "http://localhost:11434"
      default_model: "llama3.1:70b"
      timeout_seconds: 120

# ---------------------------------------------------------------------------
# Logging & Observability
# ---------------------------------------------------------------------------
logging:
  level: "INFO"                         # DEBUG, INFO, WARNING, ERROR
  format: "json"                        # "json" or "console"
  output: "stdout"                      # "stdout" or file path
  structured:
    include_timestamps: true
    include_session_id: true
    include_token_counts: true

  metrics:
    enabled: true
    prometheus_push_gateway: "http://localhost:9091"
    # Labels attached to every metric for filtering
    labels:
      project: "community-platform"
      environment: "development"

# ---------------------------------------------------------------------------
# Dashboard
# ---------------------------------------------------------------------------
dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8501
  refresh_interval_seconds: 5
  theme: "dark"

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  # Maximum tool call budget per agent (tokens). Prevents runaway costs.
  max_tokens_per_agent: 500000

  # Maximum total cost per session (USD). Prevents surprise bills.
  max_cost_per_session_usd: 10.00

  # Sandbox settings for code execution
  sandbox:
    enabled: true
    memory_limit_mb: 512
    disk_limit_mb: 100

  # Allowed file paths (agents cannot write outside these)
  allowed_paths:
    - "./platform/"
    - "./data/"
