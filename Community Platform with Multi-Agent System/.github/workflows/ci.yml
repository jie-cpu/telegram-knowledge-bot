name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check agents/ platform/ shared/ tests/ eval/
      - run: ruff format --check agents/ platform/ shared/ tests/ eval/
      - run: mypy agents/ shared/
      - run: bandit -r agents/ shared/ -q

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run meta-tests (agent system)
        run: pytest tests/ -v -m "meta" --tb=short --junitxml=reports/meta-tests.xml

      - name: Run platform tests
        run: pytest platform/backend/tests/ -v --tb=short --junitxml=reports/platform-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: reports/
        if: always()

  evaluation:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run evaluation suite
        run: python -m eval.runner --all --output-dir reports/eval/
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Generate evaluation report
        run: python -m eval.report --input-dir reports/eval/ --output reports/eval_report.html

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/eval_report.html

      - name: Check evaluation threshold
        run: |
          SCORE=$(python -m eval.report --input-dir reports/eval/ --json | jq '.overall_score')
          if (( $(echo "$SCORE < 0.75" | bc -l) )); then
            echo "Evaluation score $SCORE is below threshold 0.75"
            exit 1
          fi
          echo "Evaluation score $SCORE ✓"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: safety check --full-report

  notify:
    runs-on: ubuntu-latest
    needs: [test, evaluation, security-scan]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.evaluation.result }}" = "success" ] && \
             [ "${{ needs.security-scan.result }}" = "success" ]; then
            echo "All checks passed 🟢"
          else
            echo "Some checks failed 🔴"
            exit 1
          fi
