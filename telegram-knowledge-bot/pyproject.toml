[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-knowledge-bot"
version = "0.1.0"
description = "Telegram bot for multi-modal personal knowledge management"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.0",
    "openai>=1.0.0",
    "gitpython>=3.1.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "trafilatura>=1.6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
# Local voice transcription (no API key needed)
whisper = [
    "faster-whisper>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
