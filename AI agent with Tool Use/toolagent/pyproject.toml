[build-system]
requires = ["setuptools>=59.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolagent"
version = "1.0.0"
description = "An extensible AI agent system with tool use, guardrails, and observability"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai-agent", "tool-use", "llm", "guardrails", "observability"]

authors = [
    {name = "AI Engineer Portfolio"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tenacity>=8.2.0",
    "openai>=1.12.0",
    "anthropic>=0.29.0",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.setuptools.packages.find]
include = ["agent*", "api*", "cli*", "config*"]

[project.scripts]
toolagent = "cli.main:main"
toolagent-api = "api.main:run_server"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=agent --cov-report=term-missing --cov-report=html"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
